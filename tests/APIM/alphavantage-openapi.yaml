components:
  securitySchemes:
    apimSubscriptionKey:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
      description: API Management subscription key. The upstream vendor key is injected by the gateway.
  parameters:
    symbol:
      name: symbol
      in: query
      required: true
      description: Ticker of the equity, e.g. `IBM`. Non-US listings use a suffix, e.g. `TSCO.LON`, `RELIANCE.BSE`,
        `600104.SHH`.
      schema:
        type: string
      example: IBM
    symbolBulk:
      name: symbol
      in: query
      required: true
      description: Up to 100 comma-separated symbols. Symbols beyond the first 100 are ignored.
      schema:
        type: string
      example: MSFT,AAPL,IBM
    keywords:
      name: keywords
      in: query
      required: true
      description: Free-text search string.
      schema:
        type: string
      example: microsoft
    intervalIntraday:
      name: interval
      in: query
      required: true
      description: Spacing between consecutive data points.
      schema:
        type: string
        enum:
        - 1min
        - 5min
        - 15min
        - 30min
        - 60min
      example: 5min
    intervalIndex:
      name: interval
      in: query
      required: true
      description: Temporal resolution of the index time series.
      schema:
        type: string
        enum:
        - daily
        - weekly
        - monthly
      example: weekly
    intervalIndicator:
      name: interval
      in: query
      required: true
      description: Spacing between consecutive data points in the indicator series.
      schema:
        type: string
        enum:
        - 1min
        - 5min
        - 15min
        - 30min
        - 60min
        - daily
        - weekly
        - monthly
      example: daily
    intervalEconomic:
      name: interval
      in: query
      required: false
      description: Reporting frequency.
      schema:
        type: string
        enum:
        - daily
        - weekly
        - monthly
        - quarterly
        - annual
    month:
      name: month
      in: query
      required: false
      description: Query a specific historical month in `YYYY-MM` format. Any month from `2000-01` onward
        is supported. Intraday resolutions only.
      schema:
        type: string
        pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      example: 2009-01
    outputsize:
      name: outputsize
      in: query
      required: false
      description: '`compact` returns the latest 100 points; `full` returns the complete series. `full`
        requires a premium upstream key on several endpoints.'
      schema:
        type: string
        enum:
        - compact
        - full
        default: compact
    datatype:
      name: datatype
      in: query
      required: false
      description: Response encoding. `csv` changes the response media type to `text/csv`.
      schema:
        type: string
        enum:
        - json
        - csv
        default: json
    adjusted:
      name: adjusted
      in: query
      required: false
      description: When `true` the series is adjusted for historical splits and dividends.
      schema:
        type: boolean
        default: true
    extendedHours:
      name: extended_hours
      in: query
      required: false
      description: When `true` the series includes pre-market and post-market bars (04:00-20:00 ET for
        US markets).
      schema:
        type: boolean
        default: true
    entitlement:
      name: entitlement
      in: query
      required: false
      description: Controls data freshness. Omit for end-of-day data. `realtime` and `delayed` require
        an entitled upstream subscription and are subject to exchange/FINRA/SEC market-data rules.
      schema:
        type: string
        enum:
        - realtime
        - delayed
    seriesType:
      name: series_type
      in: query
      required: true
      description: Price series the indicator is computed on.
      schema:
        type: string
        enum:
        - close
        - open
        - high
        - low
      example: close
    timePeriod:
      name: time_period
      in: query
      required: true
      description: Number of data points used to calculate each value.
      schema:
        type: integer
        minimum: 1
      example: 60
    fromCurrency:
      name: from_currency
      in: query
      required: true
      description: Source currency; accepts both physical (`USD`) and digital (`BTC`) currency codes.
      schema:
        type: string
      example: USD
    toCurrency:
      name: to_currency
      in: query
      required: true
      description: Destination currency; accepts both physical and digital currency codes.
      schema:
        type: string
      example: JPY
    fromSymbol:
      name: from_symbol
      in: query
      required: true
      description: Base currency of the FX pair, as a three-letter code.
      schema:
        type: string
      example: EUR
    toSymbol:
      name: to_symbol
      in: query
      required: true
      description: Quote currency of the FX pair, as a three-letter code.
      schema:
        type: string
      example: USD
    cryptoSymbol:
      name: symbol
      in: query
      required: true
      description: Digital currency code, e.g. `BTC`.
      schema:
        type: string
      example: BTC
    market:
      name: market
      in: query
      required: true
      description: Exchange market to quote the digital currency in, e.g. `USD`, `EUR`, `CNY`.
      schema:
        type: string
      example: USD
    commodityInterval:
      name: interval
      in: query
      required: false
      description: Reporting frequency for the commodity series.
      schema:
        type: string
        enum:
        - daily
        - weekly
        - monthly
        - quarterly
        - annual
        default: monthly
  schemas:
    GenericPayload:
      type: object
      description: 'Vendor payloads are loosely typed: top-level keys vary by function and several contain
        spaces and numeric prefixes, for example `Time Series (Daily)` and `1. open`. The response is
        passed through unmodified rather than reshaped, so clients stay compatible with the vendor documentation
        and with existing Alpha Vantage client libraries.'
      additionalProperties: true
    ApiError:
      type: object
      description: Normalised error surfaced by the gateway.
      properties:
        statusCode:
          type: integer
          example: 429
        message:
          type: string
          example: Upstream rate limit reached. Retry after the current window closes.
        upstream:
          type: string
          description: Verbatim explanatory text from the vendor, when present.
    GlobalQuote:
      type: object
      description: Illustrative shape of the GLOBAL_QUOTE payload; keys are vendor-defined.
      properties:
        Global Quote:
          type: object
          properties:
            01. symbol:
              type: string
              example: IBM
            05. price:
              type: string
              example: '285.42'
            06. volume:
              type: string
              example: '3841029'
            07. latest trading day:
              type: string
              format: date
            10. change percent:
              type: string
              example: 1.2043%
