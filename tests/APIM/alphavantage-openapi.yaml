openapi: 3.0.1
info:
  title: Alpha Vantage Market Data API
  version: 1.0.0
  description: 'Facade over the Alpha Vantage market data service, exposed through API Management.


    ## How this differs from the vendor API


    Alpha Vantage serves every capability from a single backend route, `GET https://www.alphavantage.co/query`,
    discriminated by a `function` query parameter. OpenAPI cannot model many operations on one path and
    method, so this specification promotes each `function` to its own path — `/TIME_SERIES_DAILY`, `/GLOBAL_QUOTE`,
    and so on. An API Management policy rewrites the request back to the vendor shape, so path segments
    map one-to-one onto the values documented at https://www.alphavantage.co/documentation/.


    ## Authentication


    Callers authenticate to API Management with a subscription key. The upstream `apikey` is held as a
    named value in API Management and injected server-side; it is never accepted from, nor returned to,
    the caller. Do not send an `apikey` query parameter — it will be overwritten.


    ## Error semantics worth knowing


    The vendor returns HTTP 200 for validation failures and throttling alike, carrying an `Error Message`,
    `Note`, or `Information` field in the body. The outbound policy inspects the payload and re-maps these
    onto 400 and 429 so that standard HTTP client and retry handling behaves correctly.


    ## Entitlements


    Operations marked as requiring a premium subscription will fail against a free upstream key. Group
    them into a separate API Management product so entitlement is enforced at the gateway rather than
    surfacing as a confusing upstream message.


    ## Market data compliance


    Realtime and 15-minute delayed US market data is regulated by the exchanges, FINRA, and the SEC. Redistribution
    beyond the licensed scope — including internal onward distribution in some cases — may require a separate
    agreement. Confirm the licence terms before making `entitlement=realtime` operations broadly available.'
  contact:
    name: Alpha Vantage documentation
    url: https://www.alphavantage.co/documentation/
  termsOfService: https://www.alphavantage.co/terms_of_service/
servers:
- url: https://{apimHost}/alphavantage/v1
  description: API Management gateway
  variables:
    apimHost:
      default: apim.example.com
      description: Your API Management gateway host.
security:
- apimSubscriptionKey: []
tags:
- name: Core Stock
  description: Equity, ETF, and mutual fund time series, quotes, and lookup utilities.
- name: Index Data
  description: OHLC history for 200+ major market indices.
- name: Options
  description: Realtime and historical US options chains.
- name: Alpha Intelligence
  description: News sentiment, transcripts, movers, and insider activity.
- name: Fundamental Data
  description: Company profiles, financial statements, and corporate actions.
- name: Forex
  description: Physical currency exchange rates and FX time series.
- name: Cryptocurrencies
  description: Digital currency exchange rates and time series.
- name: Commodities
  description: Energy, metals, and agricultural commodity prices.
- name: Economic Indicators
  description: US macroeconomic series.
- name: Technical Indicators
  description: 50+ technical indicators computed on equity price series.
paths:
  /TIME_SERIES_INTRADAY:
    get:
      tags:
      - Core Stock
      summary: Intraday OHLCV time series
      description: 'Current and 20+ years of historical intraday OHLCV candles for the specified equity,
        covering pre-market and post-market sessions where applicable. Both raw (as-traded) and split/dividend-adjusted
        values can be requested.


        > **Entitlement:** requires a premium Alpha Vantage subscription upstream. Restrict this operation
        to an entitled APIM product.'
      operationId: getTimeSeriesIntraday
      parameters:
      - $ref: '#/components/parameters/symbol'
      - $ref: '#/components/parameters/intervalIntraday'
      - $ref: '#/components/parameters/adjusted'
      - $ref: '#/components/parameters/extendedHours'
      - $ref: '#/components/parameters/month'
      - $ref: '#/components/parameters/outputsize'
      - $ref: '#/components/parameters/datatype'
      - $ref: '#/components/parameters/entitlement'
      responses:
        '200':
          description: Success. Note that Alpha Vantage also returns HTTP 200 for rate-limit and validation
            failures with an explanatory body; the APIM outbound policy maps those to 4xx/429.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericPayload'
            text/csv:
              schema:
                type: string
        '400':
          description: Missing or invalid parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid APIM subscription key.
        '429':
          description: Rate limit or daily quota exceeded, at the APIM tier or upstream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Upstream unavailable.
